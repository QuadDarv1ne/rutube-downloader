<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title data-i18n="app.title">Rutube Downloader — RuTube, VK, OK, Aser.pro</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
					Roboto, sans-serif;
				margin: 0;
				padding: 20px;
				background: #1a1a1a;
				color: #e0e0e0;
				min-height: 100vh;
			}
			h1 {
				font-size: 1.25rem;
				margin: 0 0 16px 0;
				font-weight: 600;
			}
			label {
				display: block;
				font-size: 0.85rem;
				color: #999;
				margin-bottom: 4px;
			}
			input[type="text"] {
				width: 100%;
				padding: 10px 12px;
				border: 1px solid #333;
				border-radius: 8px;
				background: #252525;
				color: #e0e0e0;
				font-size: 14px;
				margin-bottom: 12px;
			}
			input[type="text"]::placeholder {
				color: #666;
			}
			.row {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
			}
			.row input {
				flex: 1;
				margin-bottom: 0;
			}
			.row-select {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
				align-items: end;
			}
			.row-select > div {
				flex: 1;
			}
			.row-select > div:last-child {
				flex: 0 0 auto;
			}
			#qualityRow {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 12px;
			}
			select {
				padding: 8px 12px;
				border: 1px solid #333;
				border-radius: 8px;
				background: #252525;
				color: #e0e0e0;
				font-size: 14px;
				min-width: 160px;
			}
			button {
				padding: 10px 16px;
				border: none;
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
				background: #333;
				color: #e0e0e0;
			}
			button:hover {
				background: #444;
			}
			button.primary {
				background: #0d6efd;
				color: #fff;
			}
			button.primary:hover {
				background: #0b5ed7;
			}
			button:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}
			#status {
				margin-top: 16px;
				padding: 12px;
				border-radius: 8px;
				background: #252525;
				font-size: 13px;
				min-height: 48px;
				max-height: 120px;
				overflow-y: auto;
				white-space: pre-wrap;
				word-break: break-all;
			}
			#status.success {
				color: #20c997;
			}
			#status.error {
				color: #dc3545;
			}
			.progress-wrap {
				margin-top: 12px;
				height: 8px;
				background: #252525;
				border-radius: 4px;
				overflow: hidden;
			}
			.progress-bar {
				height: 100%;
				background: #0d6efd;
				border-radius: 4px;
				transition: width 0.2s;
			}
			.tabs {
				display: flex;
				gap: 4px;
				margin-bottom: 16px;
			}
			.tabs button {
				padding: 8px 14px;
				border-radius: 8px;
				background: #252525;
				color: #888;
			}
			.tabs button.active {
				background: #333;
				color: #e0e0e0;
			}
			.tabs button:hover:not(.active) {
				background: #2a2a2a;
				color: #ccc;
			}
			.panel {
				display: none;
			}
			.panel.active {
				display: block;
			}
			.header-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 16px;
			}
			.header-row h1 {
				margin: 0;
			}
			.lang-selector {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.lang-selector label {
				margin: 0;
				font-size: 0.8rem;
				color: #888;
			}
			.lang-selector select {
				padding: 4px 8px;
				font-size: 12px;
				min-width: auto;
				margin-bottom: 0;
			}
			.links-section {
				margin-top: 16px;
				padding-top: 12px;
				border-top: 1px solid #333;
			}
			.links-section label {
				font-size: 0.75rem;
				color: #666;
				margin-bottom: 8px;
			}
			.links-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 6px;
			}
			.links-grid a {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 6px 10px;
				border-radius: 8px;
				background: #252525;
				border: 1px solid #333;
				color: #777;
				text-decoration: none;
				font-size: 12px;
				transition: all 0.15s;
			}
			.links-grid a:hover {
				border-color: #0d6efd;
				background: #2a2a2a;
				color: #e0e0e0;
				transform: scale(1.03);
			}
			.links-grid a svg {
				flex-shrink: 0;
			}
			.links-grid a span.link-label {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-weight: 500;
			}
			.links-grid a .link-ext {
				margin-left: auto;
				opacity: 0;
				transition: opacity 0.15s;
				flex-shrink: 0;
			}
			.links-grid a:hover .link-ext {
				opacity: 0.5;
			}
		</style>
	</head>
	<body>
		<div class="header-row">
			<h1 data-i18n="app.heading">Rutube Downloader</h1>
			<div class="lang-selector">
				<label data-i18n="menu.language">Язык</label>
				<select id="langSelect">
					<option value="ru">Русский</option>
					<option value="en">English</option>
					<option value="zh">中文</option>
				</select>
			</div>
		</div>
		<div class="tabs">
			<button type="button" id="tabOther" class="active" data-i18n="tab.other">
				RuTube, VK, OK, Aser
			</button>
			<button type="button" id="tabYoutube" data-i18n="tab.youtube">YouTube</button>
			<button type="button" id="tabConvert" data-i18n="tab.convert">Конвертировать</button>
		</div>

		<!-- RuTube, VK, OK, Aser -->
		<div id="panelOther" class="panel active">
			<label data-i18n="label.videoUrl">Ссылка на видео</label>
			<input
				type="text"
				id="urlOther"
				data-i18n-placeholder="placeholder.urlOther"
				placeholder="rutube.ru, vkvideo.ru, ok.ru, aser.pro"
			/>
			<label data-i18n="label.saveFolder">Папка сохранения</label>
			<div class="row">
				<input
					type="text"
					id="dir"
					data-i18n-placeholder="placeholder.selectFolder"
					placeholder="Выберите папку"
					readonly
				/>
				<button type="button" id="btnFolder" data-i18n="btn.folder">Папка</button>
			</div>
			<div class="row-select">
				<div>
					<label data-i18n="label.videoFormat">Формат видео</label>
					<select id="formatOther">
						<option value="mp4">MP4</option>
						<option value="mkv">MKV</option>
						<option value="avi">AVI</option>
						<option value="mov">MOV</option>
						<option value="webm">WebM</option>
					</select>
				</div>
				<div>
					<label data-i18n="label.extractAudio">Извлечь аудио</label>
					<select id="audioFormatOther">
						<option value="" data-i18n="audioFormat.none">Нет</option>
						<option value="mp3">MP3</option>
						<option value="wav">WAV</option>
						<option value="flac">FLAC</option>
					</select>
				</div>
			</div>
			<button type="button" id="btnDownload" class="primary" data-i18n="btn.download">
				Скачать
			</button>
		</div>

		<!-- YouTube -->
		<div id="panelYoutube" class="panel">
			<label data-i18n="label.youtubeUrl">Ссылка на видео YouTube</label>
			<input
				type="text"
				id="urlYoutube"
				data-i18n-placeholder="placeholder.urlYoutube"
				placeholder="youtube.com, youtu.be"
			/>
			<label data-i18n="label.saveFolder">Папка сохранения</label>
			<div class="row">
				<input
					type="text"
					id="dirYoutube"
					data-i18n-placeholder="placeholder.selectFolder"
					placeholder="Выберите папку"
					readonly
				/>
				<button type="button" id="btnFolderYoutube" data-i18n="btn.folder">Папка</button>
			</div>
			<div id="qualityRow">
				<label for="quality" style="margin-bottom: 0" data-i18n="label.quality">Качество:</label>
				<select id="quality">
					<option value="best" data-i18n="quality.best">Лучшее (MP4)</option>
					<option value="1080">1080p</option>
					<option value="720">720p</option>
					<option value="480">480p</option>
					<option value="360">360p</option>
					<option value="audio" data-i18n="quality.audio">Только аудио</option>
				</select>
			</div>
			<div class="row-select">
				<div>
					<label data-i18n="label.videoFormat">Формат видео</label>
					<select id="formatYoutube">
						<option value="mp4">MP4</option>
						<option value="mkv">MKV</option>
						<option value="webm">WebM</option>
					</select>
				</div>
				<div>
					<label data-i18n="label.extractAudio">Извлечь аудио</label>
					<select id="audioFormatYoutube">
						<option value="" data-i18n="audioFormat.none">Нет</option>
						<option value="mp3">MP3</option>
						<option value="wav">WAV</option>
						<option value="flac">FLAC</option>
					</select>
				</div>
			</div>
			<button type="button" id="btnDownloadYoutube" class="primary" data-i18n="btn.download">
				Скачать
			</button>
		</div>

		<!-- Конвертировать -->
		<div id="panelConvert" class="panel">
			<label data-i18n="label.sourceFile">Исходный файл</label>
			<div class="row">
				<input
					type="text"
					id="convertSrc"
					data-i18n-placeholder="placeholder.selectFile"
					placeholder="Выберите видео-файл"
					readonly
				/>
				<button type="button" id="btnConvertFile" data-i18n="btn.file">Файл</button>
			</div>
			<label data-i18n="label.saveFolder">Папка сохранения</label>
			<div class="row">
				<input
					type="text"
					id="convertDir"
					data-i18n-placeholder="placeholder.selectFolder"
					placeholder="Выберите папку"
					readonly
				/>
				<button type="button" id="btnConvertFolder" data-i18n="btn.folder">Папка</button>
			</div>
			<div class="row-select">
				<div>
					<label data-i18n="label.mode">Режим</label>
					<select id="convertMode">
						<option value="video" data-i18n="convertMode.video">Конвертировать видео</option>
						<option value="audio" data-i18n="convertMode.audio">Извлечь аудио</option>
					</select>
				</div>
				<div>
					<label data-i18n="label.format">Формат</label>
					<select id="convertFormat">
						<option value="mp4">MP4</option>
						<option value="mkv">MKV</option>
						<option value="avi">AVI</option>
						<option value="mov">MOV</option>
						<option value="webm">WebM</option>
					</select>
					<select id="convertAudioFormat" style="display: none">
						<option value="mp3">MP3</option>
						<option value="wav">WAV</option>
						<option value="flac">FLAC</option>
					</select>
				</div>
			</div>
			<button type="button" id="btnConvert" class="primary" data-i18n="btn.convert">
				Конвертировать
			</button>
		</div>
