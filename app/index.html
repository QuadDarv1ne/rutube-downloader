<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title>Rutube Downloader — RuTube, VK, OK, Aser.pro</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
					Roboto, sans-serif;
				margin: 0;
				padding: 20px;
				background: #1a1a1a;
				color: #e0e0e0;
				min-height: 100vh;
			}
			h1 {
				font-size: 1.25rem;
				margin: 0 0 16px 0;
				font-weight: 600;
			}
			label {
				display: block;
				font-size: 0.85rem;
				color: #999;
				margin-bottom: 4px;
			}
			input[type="text"] {
				width: 100%;
				padding: 10px 12px;
				border: 1px solid #333;
				border-radius: 8px;
				background: #252525;
				color: #e0e0e0;
				font-size: 14px;
				margin-bottom: 12px;
			}
			input[type="text"]::placeholder {
				color: #666;
			}
			.row {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
			}
			.row input {
				flex: 1;
				margin-bottom: 0;
			}
			.row-select {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
				align-items: end;
			}
			.row-select > div {
				flex: 1;
			}
			.row-select > div:last-child {
				flex: 0 0 auto;
			}
			#qualityRow {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 12px;
			}
			select {
				padding: 8px 12px;
				border: 1px solid #333;
				border-radius: 8px;
				background: #252525;
				color: #e0e0e0;
				font-size: 14px;
				min-width: 160px;
			}
			button {
				padding: 10px 16px;
				border: none;
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
				background: #333;
				color: #e0e0e0;
			}
			button:hover {
				background: #444;
			}
			button.primary {
				background: #0d6efd;
				color: #fff;
			}
			button.primary:hover {
				background: #0b5ed7;
			}
			button:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}
			#status {
				margin-top: 16px;
				padding: 12px;
				border-radius: 8px;
				background: #252525;
				font-size: 13px;
				min-height: 48px;
				max-height: 120px;
				overflow-y: auto;
				white-space: pre-wrap;
				word-break: break-all;
			}
			#status.success {
				color: #20c997;
			}
			#status.error {
				color: #dc3545;
			}
			.progress-wrap {
				margin-top: 12px;
				height: 8px;
				background: #252525;
				border-radius: 4px;
				overflow: hidden;
			}
			.progress-bar {
				height: 100%;
				background: #0d6efd;
				border-radius: 4px;
				transition: width 0.2s;
			}
			.tabs {
				display: flex;
				gap: 4px;
				margin-bottom: 16px;
			}
			.tabs button {
				padding: 8px 14px;
				border-radius: 8px;
				background: #252525;
				color: #888;
			}
			.tabs button.active {
				background: #333;
				color: #e0e0e0;
			}
			.tabs button:hover:not(.active) {
				background: #2a2a2a;
				color: #ccc;
			}
			.panel {
				display: none;
			}
			.panel.active {
				display: block;
			}
		</style>
	</head>
	<body>
		<h1>Rutube Downloader</h1>
		<div class="tabs">
			<button type="button" id="tabOther" class="active">
				RuTube, VK, OK, Aser
			</button>
			<button type="button" id="tabYoutube">YouTube</button>
			<button type="button" id="tabConvert">Конвертировать</button>
		</div>

		<!-- RuTube, VK, OK, Aser -->
		<div id="panelOther" class="panel active">
			<label>Ссылка на видео</label>
			<input
				type="text"
				id="urlOther"
				placeholder="rutube.ru, vkvideo.ru, ok.ru, aser.pro"
			/>
			<label>Папка сохранения</label>
			<div class="row">
				<input
					type="text"
					id="dir"
					placeholder="Выберите папку"
					readonly
				/>
				<button type="button" id="btnFolder">Папка</button>
			</div>
			<div class="row-select">
				<div>
					<label>Формат видео</label>
					<select id="formatOther">
						<option value="mp4">MP4</option>
						<option value="mkv">MKV</option>
						<option value="avi">AVI</option>
						<option value="mov">MOV</option>
						<option value="webm">WebM</option>
					</select>
				</div>
				<div>
					<label>Извлечь аудио</label>
					<select id="audioFormatOther">
						<option value="">Нет</option>
						<option value="mp3">MP3</option>
						<option value="wav">WAV</option>
						<option value="flac">FLAC</option>
					</select>
				</div>
			</div>
			<button type="button" id="btnDownload" class="primary">
				Скачать
			</button>
		</div>

		<!-- YouTube -->
		<div id="panelYoutube" class="panel">
			<label>Ссылка на видео YouTube</label>
			<input
				type="text"
				id="urlYoutube"
				placeholder="youtube.com, youtu.be"
			/>
			<label>Папка сохранения</label>
			<div class="row">
				<input
					type="text"
					id="dirYoutube"
					placeholder="Выберите папку"
					readonly
				/>
				<button type="button" id="btnFolderYoutube">Папка</button>
			</div>
			<div id="qualityRow">
				<label for="quality" style="margin-bottom: 0">Качество:</label>
				<select id="quality">
					<option value="best">Лучшее (MP4)</option>
					<option value="1080">1080p</option>
					<option value="720">720p</option>
					<option value="480">480p</option>
					<option value="360">360p</option>
					<option value="audio">Только аудио</option>
				</select>
			</div>
			<div class="row-select">
				<div>
					<label>Формат видео</label>
					<select id="formatYoutube">
						<option value="mp4">MP4</option>
						<option value="mkv">MKV</option>
						<option value="webm">WebM</option>
					</select>
				</div>
				<div>
					<label>Извлечь аудио</label>
					<select id="audioFormatYoutube">
						<option value="">Нет</option>
						<option value="mp3">MP3</option>
						<option value="wav">WAV</option>
						<option value="flac">FLAC</option>
					</select>
				</div>
			</div>
			<button type="button" id="btnDownloadYoutube" class="primary">
				Скачать
			</button>
		</div>

		<!-- Конвертировать -->
		<div id="panelConvert" class="panel">
			<label>Исходный файл</label>
			<div class="row">
				<input
					type="text"
					id="convertSrc"
					placeholder="Выберите видео-файл"
					readonly
				/>
				<button type="button" id="btnConvertFile">Файл</button>
			</div>
			<label>Папка сохранения</label>
			<div class="row">
				<input
					type="text"
					id="convertDir"
					placeholder="Выберите папку"
					readonly
				/>
				<button type="button" id="btnConvertFolder">Папка</button>
			</div>
			<div class="row-select">
				<div>
					<label>Режим</label>
					<select id="convertMode">
						<option value="video">Конвертировать видео</option>
						<option value="audio">Извлечь аудио</option>
					</select>
				</div>
				<div>
					<label>Формат</label>
					<select id="convertFormat">
						<option value="mp4">MP4</option>
						<option value="mkv">MKV</option>
						<option value="avi">AVI</option>
						<option value="mov">MOV</option>
						<option value="webm">WebM</option>
					</select>
					<select id="convertAudioFormat" style="display: none">
						<option value="mp3">MP3</option>
						<option value="wav">WAV</option>
						<option value="flac">FLAC</option>
					</select>
				</div>
			</div>
			<button type="button" id="btnConvert" class="primary">
				Конвертировать
			</button>
		</div>

		<div class="progress-wrap" id="progressWrap" style="display: none">
			<div class="progress-bar" id="progressBar" style="width: 0%"></div>
		</div>
		<div id="status"></div>

		<script src="renderer.js"></script>
	</body>
</html>
