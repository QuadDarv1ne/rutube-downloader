<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
	<title>Rutube Downloader — RuTube, VK, OK, Aser.pro</title>
	<style>
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			margin: 0;
			padding: 20px;
			background: #1a1a1a;
			color: #e0e0e0;
			min-height: 100vh;
		}
		h1 { font-size: 1.25rem; margin: 0 0 16px 0; font-weight: 600; }
		label { display: block; font-size: 0.85rem; color: #999; margin-bottom: 4px; }
		input[type="text"] {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid #333;
			border-radius: 8px;
			background: #252525;
			color: #e0e0e0;
			font-size: 14px;
			margin-bottom: 12px;
		}
		input[type="text"]::placeholder { color: #666; }
		.row { display: flex; gap: 8px; margin-bottom: 12px; }
		.row input { flex: 1; margin-bottom: 0; }
		#qualityRow { display: none; margin-bottom: 12px; }
		#qualityRow.visible { display: flex; align-items: center; gap: 8px; }
		select {
			padding: 8px 12px;
			border: 1px solid #333;
			border-radius: 8px;
			background: #252525;
			color: #e0e0e0;
			font-size: 14px;
			min-width: 160px;
		}
		button {
			padding: 10px 16px;
			border: none;
			border-radius: 8px;
			font-size: 14px;
			cursor: pointer;
			background: #333;
			color: #e0e0e0;
		}
		button:hover { background: #444; }
		button.primary { background: #0d6efd; color: #fff; }
		button.primary:hover { background: #0b5ed7; }
		button:disabled { opacity: 0.6; cursor: not-allowed; }
		#status {
			margin-top: 16px;
			padding: 12px;
			border-radius: 8px;
			background: #252525;
			font-size: 13px;
			min-height: 48px;
			white-space: pre-wrap;
			word-break: break-all;
		}
		#status.success { color: #20c997; }
		#status.error { color: #dc3545; }
		.progress-wrap {
			margin-top: 12px;
			height: 8px;
			background: #252525;
			border-radius: 4px;
			overflow: hidden;
		}
		.progress-bar {
			height: 100%;
			background: #0d6efd;
			border-radius: 4px;
			transition: width 0.2s;
		}
		.tabs {
			display: flex;
			gap: 4px;
			margin-bottom: 16px;
		}
		.tabs button {
			padding: 8px 14px;
			border-radius: 8px;
			background: #252525;
			color: #888;
		}
		.tabs button.active {
			background: #333;
			color: #e0e0e0;
		}
		.tabs button:hover:not(.active) {
			background: #2a2a2a;
			color: #ccc;
		}
		.panel { display: none; }
		.panel.active { display: block; }
	</style>
</head>
<body>
	<h1>Rutube Downloader</h1>
	<div class="tabs">
		<button type="button" id="tabOther" class="active">RuTube, VK, OK, Aser</button>
		<button type="button" id="tabYoutube">YouTube</button>
	</div>
	<div id="panelOther" class="panel active">
		<label>Ссылка на видео</label>
		<input type="text" id="urlOther" placeholder="rutube.ru, vkvideo.ru, ok.ru, aser.pro" />
		<label>Папка сохранения</label>
		<div class="row">
			<input type="text" id="dir" placeholder="Выберите папку" readonly />
			<button type="button" id="btnFolder">Папка</button>
		</div>
		<button type="button" id="btnDownload" class="primary">Скачать</button>
	</div>
	<div id="panelYoutube" class="panel">
		<label>Ссылка на видео YouTube</label>
		<input type="text" id="urlYoutube" placeholder="youtube.com, youtu.be" />
		<label>Папка сохранения</label>
		<div class="row">
			<input type="text" id="dirYoutube" placeholder="Выберите папку" readonly />
			<button type="button" id="btnFolderYoutube">Папка</button>
		</div>
		<div id="qualityRow">
			<label for="quality" style="margin-bottom: 0;">Качество:</label>
			<select id="quality">
				<option value="best">Лучшее (MP4)</option>
				<option value="1080">1080p</option>
				<option value="720">720p</option>
				<option value="480">480p</option>
				<option value="360">360p</option>
				<option value="audio">Только аудио</option>
			</select>
		</div>
		<button type="button" id="btnDownloadYoutube" class="primary">Скачать</button>
	</div>
	<div class="progress-wrap" id="progressWrap" style="display: none;">
		<div class="progress-bar" id="progressBar" style="width: 0%;"></div>
	</div>
	<div id="status"></div>

	<script>
		const tabOther = document.getElementById("tabOther");
		const tabYoutube = document.getElementById("tabYoutube");
		const panelOther = document.getElementById("panelOther");
		const panelYoutube = document.getElementById("panelYoutube");
		const urlOther = document.getElementById("urlOther");
		const urlYoutube = document.getElementById("urlYoutube");
		const dirEl = document.getElementById("dir");
		const dirYoutube = document.getElementById("dirYoutube");
		const qualityEl = document.getElementById("quality");
		const btnFolder = document.getElementById("btnFolder");
		const btnFolderYoutube = document.getElementById("btnFolderYoutube");
		const btnDownload = document.getElementById("btnDownload");
		const btnDownloadYoutube = document.getElementById("btnDownloadYoutube");
		const statusEl = document.getElementById("status");
		const progressWrap = document.getElementById("progressWrap");
		const progressBar = document.getElementById("progressBar");

		function setStatus(text, type = "") {
			statusEl.textContent = text;
			statusEl.className = type;
		}

		tabOther.addEventListener("click", () => {
			tabOther.classList.add("active");
			tabYoutube.classList.remove("active");
			panelOther.classList.add("active");
			panelYoutube.classList.remove("active");
		});
		tabYoutube.addEventListener("click", () => {
			tabYoutube.classList.add("active");
			tabOther.classList.remove("active");
			panelYoutube.classList.add("active");
			panelOther.classList.remove("active");
		});

		btnFolder.addEventListener("click", async () => {
			const path = await window.api.selectFolder();
			if (path) dirEl.value = path;
		});
		btnFolderYoutube.addEventListener("click", async () => {
			const path = await window.api.selectFolder();
			if (path) dirYoutube.value = path;
		});

		const removeProgressListener = window.api.onDownloadProgress((data) => {
			if (data.stage === "segments" && data.total > 0) {
				progressWrap.style.display = "block";
				progressBar.style.width = (100 * data.current / data.total) + "%";
				setStatus("Сегменты: " + data.current + " / " + data.total);
			} else if (data.stage === "download" && data.message) {
				progressWrap.style.display = "block";
				setStatus(data.message);
			} else if (data.stage === "merge") {
				setStatus("Объединение файлов...");
			} else if (data.stage === "convert") {
				setStatus("Конвертация в MP4...");
			} else if (data.stage === "done" && data.filePath) {
				progressWrap.style.display = "none";
				progressBar.style.width = "0%";
				setStatus("Готово!\n" + data.filePath, "success");
			}
		});

		async function doDownload(url, dir, quality) {
			if (!url) {
				setStatus("Введите ссылку на видео", "error");
				return;
			}
			if (!dir) {
				setStatus("Выберите папку для сохранения", "error");
				return;
			}
			btnDownload.disabled = true;
			btnDownloadYoutube.disabled = true;
			progressWrap.style.display = "none";
			progressBar.style.width = "0%";
			setStatus("Загрузка...");
			try {
				const result = await window.api.download(url, dir, quality);
				if (result.ok) {
					setStatus("Готово!\n" + result.filePath, "success");
				} else {
					progressWrap.style.display = "none";
					progressBar.style.width = "0%";
					setStatus(result.error, "error");
				}
			} catch (e) {
				progressWrap.style.display = "none";
				progressBar.style.width = "0%";
				setStatus(e.message || "Ошибка", "error");
			}
			btnDownload.disabled = false;
			btnDownloadYoutube.disabled = false;
		}

		btnDownload.addEventListener("click", () => {
			doDownload(urlOther.value.trim(), dirEl.value.trim(), undefined);
		});
		btnDownloadYoutube.addEventListener("click", () => {
			doDownload(urlYoutube.value.trim(), dirYoutube.value.trim(), qualityEl.value);
		});
	</script>
</body>
</html>
