<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rutube Downloader — RuTube, VK, OK, Aser.pro</title>
	<style>
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			margin: 0;
			padding: 20px;
			background: #1a1a1a;
			color: #e0e0e0;
			min-height: 100vh;
		}
		h1 { font-size: 1.25rem; margin: 0 0 16px 0; font-weight: 600; }
		label { display: block; font-size: 0.85rem; color: #999; margin-bottom: 4px; }
		input[type="text"] {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid #333;
			border-radius: 8px;
			background: #252525;
			color: #e0e0e0;
			font-size: 14px;
			margin-bottom: 12px;
		}
		input[type="text"]::placeholder { color: #666; }
		.row { display: flex; gap: 8px; margin-bottom: 12px; }
		.row input { flex: 1; margin-bottom: 0; }
		button {
			padding: 10px 16px;
			border: none;
			border-radius: 8px;
			font-size: 14px;
			cursor: pointer;
			background: #333;
			color: #e0e0e0;
		}
		button:hover { background: #444; }
		button.primary { background: #0d6efd; color: #fff; }
		button.primary:hover { background: #0b5ed7; }
		button:disabled { opacity: 0.6; cursor: not-allowed; }
		#status {
			margin-top: 16px;
			padding: 12px;
			border-radius: 8px;
			background: #252525;
			font-size: 13px;
			min-height: 48px;
			white-space: pre-wrap;
			word-break: break-all;
		}
		#status.success { color: #20c997; }
		#status.error { color: #dc3545; }
		.progress-wrap {
			margin-top: 12px;
			height: 8px;
			background: #252525;
			border-radius: 4px;
			overflow: hidden;
		}
		.progress-bar {
			height: 100%;
			background: #0d6efd;
			border-radius: 4px;
			transition: width 0.2s;
		}
	</style>
</head>
<body>
	<h1>Rutube Downloader</h1>
	<p style="font-size: 12px; color: #888; margin: 0 0 12px 0;">RuTube, VK Video, OK.ru, Aser.pro</p>
	<label>Ссылка на видео</label>
	<input type="text" id="url" placeholder="https://rutube.ru/video/... или vkvideo.ru, ok.ru, aser.pro" />
	<label>Папка сохранения</label>
	<div class="row">
		<input type="text" id="dir" placeholder="Выберите папку" readonly />
		<button type="button" id="btnFolder">Папка</button>
	</div>
	<button type="button" id="btnDownload" class="primary">Скачать</button>
	<div class="progress-wrap" id="progressWrap" style="display: none;">
		<div class="progress-bar" id="progressBar" style="width: 0%;"></div>
	</div>
	<div id="status"></div>

	<script>
		const urlEl = document.getElementById("url");
		const dirEl = document.getElementById("dir");
		const btnFolder = document.getElementById("btnFolder");
		const btnDownload = document.getElementById("btnDownload");
		const statusEl = document.getElementById("status");

		function setStatus(text, type = "") {
			statusEl.textContent = text;
			statusEl.className = type;
		}

		const progressWrap = document.getElementById("progressWrap");
		const progressBar = document.getElementById("progressBar");

		btnFolder.addEventListener("click", async () => {
			const path = await window.api.selectFolder();
			if (path) dirEl.value = path;
		});

		window.api.onDownloadProgress((data) => {
			if (data.stage === "segments" && data.total > 0) {
				progressWrap.style.display = "block";
				progressBar.style.width = (100 * data.current / data.total) + "%";
				setStatus("Сегменты: " + data.current + " / " + data.total);
			} else if (data.stage === "merge") {
				setStatus("Объединение файлов...");
			} else if (data.stage === "convert") {
				setStatus("Конвертация в MP4...");
			} else if (data.stage === "done" && data.filePath) {
				progressWrap.style.display = "none";
				progressBar.style.width = "0%";
				setStatus("Готово!\n" + data.filePath, "success");
			}
		});

		btnDownload.addEventListener("click", async () => {
			const url = urlEl.value.trim();
			const dir = dirEl.value.trim();
			if (!url) {
				setStatus("Введите ссылку на видео", "error");
				return;
			}
			if (!dir) {
				setStatus("Выберите папку для сохранения", "error");
				return;
			}
			btnDownload.disabled = true;
			progressWrap.style.display = "none";
			progressBar.style.width = "0%";
			setStatus("Загрузка...");
			try {
				const result = await window.api.download(url, dir);
				if (result.ok) {
					setStatus("Готово!\n" + result.filePath, "success");
				} else {
					setStatus(result.error, "error");
				}
			} catch (e) {
				setStatus(e.message || "Ошибка", "error");
			}
			btnDownload.disabled = false;
		});
	</script>
</body>
</html>
